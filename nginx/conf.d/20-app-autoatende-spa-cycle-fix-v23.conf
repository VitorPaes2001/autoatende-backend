server {
    listen 80;
    server_name app.autoatendeai.com.br;
    include /etc/nginx/conf.d/autoatende-acme-location.inc; # __AUTOATENDE_TLS_SAN_WEBROOT_STAGING_PREFLIGHT_V20_C1_TLS_B1_R4__

        location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.autoatendeai.com.br;
    include /etc/nginx/conf.d/autoatende-acme-location.inc; # __AUTOATENDE_TLS_SAN_WEBROOT_STAGING_PREFLIGHT_V20_C1_TLS_B1_R4__

    ssl_certificate /etc/nginx/conf.d/tls.crt;
    ssl_certificate_key /etc/nginx/conf.d/tls.key;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /api/ {
        proxy_pass http://whatsapp-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri /index.html =404;
    }
}
