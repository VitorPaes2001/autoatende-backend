name: Backend CI

on:
  push:
    branches: [ "main", "trae-work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    # Se existir script de lint, rode aqui
    # - name: Run Linter
    #   run: npm run lint

    - name: Docker Build Check
      run: docker build . --file Dockerfile --tag whatsapp-api:ci-test
